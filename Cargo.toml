[package]
name = "cloudflare-ddns"
version = "0.1.0"
edition = "2024"
authors = ["Jonathan Poisson"]

[dependencies]
dotenvy = "0.15.7"
log = "0.4.28"
env_logger = "0.11.8"
anyhow = "1.0.100"
cloudflare = { version = "0.14.0" , features = ["rustls-tls", "blocking"], default-features=false }
reqwest = { version = "0.12.24", features = ["rustls-tls", "json", "blocking"], default-features=false }

[lints.clippy]
enum_glob_use = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
opt-level = 3
strip = "debuginfo"